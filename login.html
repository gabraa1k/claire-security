
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso Admin | CLAIRE SECURITY</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #070b20; color: #f4f5ff;
      font-family: Segoe UI, Arial, sans-serif; padding: 20px;
    }
    .card {
      width: 100%; max-width: 420px; padding: 30px;
      background: #0d1530; border: 1px solid #1b3158;
      border-radius: 18px; box-shadow: 0 0 35px #ff35c822;
    }
    h1 { color: #ff72dc; margin-top: 0; }
    p { color: #a4b2d4; line-height: 1.5; }
    label { display: block; margin-top: 16px; }
    input {
      width: 100%; padding: 12px; margin-top: 7px;
      background: #070d22; color: white; border: 1px solid #25416d;
      border-radius: 8px;
    }
    button {
      width: 100%; margin-top: 22px; padding: 13px;
      border: 0; border-radius: 8px; background: #ff35c8;
      color: white; font-weight: bold; cursor: pointer;
    }
    #message { overflow-wrap: anywhere; }
    a { color: #00e6f5; }
  </style>
</head>
<body>
  <main class="card">
    <h1>CLAIRE SECURITY</h1>
    <p>Acceso privado para administradores autorizados.</p>

    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button id="submitBtn" type="submit">Iniciar sesión</button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="./">Volver a la página principal</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');
    const button = document.getElementById('submitBtn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = 'Comprobando acceso...';

      try {
        const config = window.CLAIRE_CONFIG;

        if (!config?.supabaseUrl || !config?.supabaseKey ||
            !window.supabase?.createClient) {
          throw new Error('Falta la configuración de Supabase.');
        }

        const client = window.supabase.createClient(
          config.supabaseUrl, config.supabaseKey
        );

        const { data, error } = await client.auth.signInWithPassword({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });

        if (error) throw error;

        const role = data.user?.app_metadata?.role;

        if (role !== 'admin') {
          await client.auth.signOut();
          throw new Error('Esta cuenta no tiene acceso de administrador.');
        }

        message.textContent =
          'Inicio de sesión correcto. La protección de informes debe verificarse antes de abrirlos.';
      } catch (error) {
        message.textContent = error.message ||
          'No se pudo iniciar sesión. Verifica los datos.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
